<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0171c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#brandGrad)" />
  <!-- Glass accent -->
  <rect x="16" y="16" width="160" height="70" rx="28" fill="#ffffff" fill-opacity="0.12" />
  <!-- Letter K -->
  <text x="96" y="132" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" filter="url(#shadow)">K</text>
  <!-- Accent dot -->
  <circle cx="148" cy="136" r="10" fill="#38bdf8" />
</svg>
